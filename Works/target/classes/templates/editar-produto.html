<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Produto</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div class="container">

    <div class="card">

        <h1>Editar Produto</h1>

        <form th:action="@{/produtos/atualizar/{id}(id=${produto.id})}"
              th:object="${produto}"
              method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}"/>

            <div class="form-grid">

                <div class="campo">
                    <label>Nome do Produto</label>
                    <input type="text"
                           th:field="*{nome}"
                           required>
                </div>

                <div class="campo">
                    <label>Stock</label>
                    <input type="number"
                           th:field="*{stock}"
                           required>
                </div>

                <div class="campo">
                    <label>Preço de Compra</label>
                    <input type="number"
                           step="0.01"
                           th:field="*{precoCompra}"
                           required>
                </div>

                <div class="campo">
                    <label>Preço de Venda</label>
                    <input type="number"
                           step="0.01"
                           th:field="*{precoVenda}"
                           required>
                </div>

            </div>

            <div class="acoes">

                <button type="submit"
                        class="btn-primary">
                    Atualizar Produto
                </button>

                <a th:href="@{/produtos}"
                   class="btn-secondary">
                    Voltar
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
