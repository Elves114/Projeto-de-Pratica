<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cadastro</title>
</head>
<body>

<h1>Cadastro</h1>

<form th:action="@{/cadastro}" method="post">

    <input type="text"
           name="nome"
           placeholder="Nome">

    <br><br>

    <input type="email"
           name="email"
           placeholder="Email">

    <br><br>

    <input type="password"
           name="senha"
           placeholder="Senha">

    <br><br>

    <button type="submit">
        Cadastrar
    </button>

</form>

</body>
</html>
