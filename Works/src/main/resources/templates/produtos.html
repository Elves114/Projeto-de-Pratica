<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Gestão de Produtos</title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<!-- SIDEBAR -->
<div th:replace="fragments/sidebar :: sidebar"></div>

<!-- CONTEÚDO PRINCIPAL -->
<div class="content">

    <h1>Gestão de Produtos</h1>

    <!-- FORM NOVO PRODUTO -->
    <h2>Novo Produto</h2>

    <form th:action="@{/produtos/salvar}"
          th:object="${produto}"
          method="post">

        <input type="hidden"
               th:name="${_csrf.parameterName}"
               th:value="${_csrf.token}" />

        <div class="form-grid">

            <div class="campo">
                <label>Nome:</label>
                <input type="text" th:field="*{nome}" required>
            </div>

            <div class="campo">
                <label>Stock:</label>
                <input type="number" th:field="*{stock}" required>
            </div>

            <div class="campo">
                <label>Preço de Compra:</label>
                <input type="number" step="0.01" th:field="*{precoCompra}" required>
            </div>

            <div class="campo">
                <label>Preço de Venda:</label>
                <input type="number" step="0.01" th:field="*{precoVenda}" required>
            </div>

        </div>
<br>
        <button type="submit" class="btn-salvar">
            Salvar Produto
        </button>

    </form>

    <hr>

    <!-- PESQUISA -->
    <h2>Pesquisar Produto</h2>

    <form th:action="@{/produtos/pesquisar}" method="get">
        <input type="text" name="nome" placeholder="Nome do produto">
        <br>
        <br>
        <button type="submit">Pesquisar</button>
    </form>

    <hr>

    <!-- LISTA -->
    <h2>Lista de Produtos</h2>

    <table>

        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Compra</th>
            <th>Venda</th>
            <th>Stock</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:if="${#lists.isEmpty(produtos)}">
            <td colspan="6">Nenhum produto encontrado.</td>
        </tr>

        <tr th:each="produto : ${produtos}">
            <td th:text="${produto.id}"></td>
            <td th:text="${produto.nome}"></td>
            <td th:text="${produto.precoCompra}"></td>
            <td th:text="${produto.precoVenda}"></td>
            <td th:text="${produto.stock}"></td>

            <td>

                <a th:href="@{/produtos/editar/{id}(id=${produto.id})}">
                    Editar
                </a>

                &nbsp;|&nbsp;

                <form th:action="@{/produtos/remover/{id}(id=${produto.id})}"
                      method="post"
                      style="display:inline;">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}" />

                    <button type="submit"
                            onclick="return confirm('Deseja realmente eliminar este produto?')">
                        Eliminar
                    </button>

                </form>

            </td>
        </tr>

        </tbody>

    </table>

</div>

<script>
    function toggleMenu() {
        const sidebar = document.getElementById("sidebar");
        const overlay = document.getElementById("overlay");

        sidebar.classList.toggle("active");
        overlay.classList.toggle("active");
    }
</script>

</body>
</html>
