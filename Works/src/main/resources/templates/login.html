<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login</title>

    <link rel="stylesheet"
          th:href="@{/css/style.css}">
</head>
<body>

<div class="auth-page">

    <div class="auth-card">

        <h1>Entrar no Sistema</h1>

        <div th:if="${param.error}"
             class="alert-error">
            Email ou senha inválidos.
        </div>

        <div th:if="${param.blocked}"
             class="alert-blocked">
            Conta bloqueada por excesso de tentativas.
            Aguarde 15 minutos.
        </div>

        <form th:action="@{/login}"
              method="post">

            <div class="form-group">
                <label>Email</label>
                <input type="email"
                       name="username"
                       required>
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password"
                       name="password"
                       required>
            </div>
<br>
            <button type="submit"
                    class="btn-login">
                Entrar
            </button>

        </form>
    <br>
        <a th:href="@{/recuperar-senha}"
           class="auth-link">
            Esqueci a minha senha
        </a>

    </div>

</div>

</body>
</html>
